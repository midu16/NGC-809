# SriovNetworks (generate the NADs in the test namespace): VLAN, trust, per-VF min/max rate, IPAM.
---
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetwork
metadata:
  name: ngc809-master0-sink
  namespace: openshift-sriov-network-operator
  annotations:
    operator.sriovnetwork.openshift.io/last-network-namespace: <namespace>
spec:
  ipam: '{"type": "host-local","ranges": [[{"subnet": "<vf1-server-subnet>"}]],"dataDir": "/run/my-orchestrator/container-ipam-state-sink"}'
  logLevel: info
  maxTxRate: 0   # spec.vf1.rateMbps (+ rateMode, applied by tools/render.py)
  minTxRate: 0   # spec.vf1.rateMbps (+ rateMode, applied by tools/render.py)
  networkNamespace: <namespace>
  resourceName: ngc809_srv_nic2_vf
  spoofChk: 'off'
  trust: 'on'
  vlan: 0        # spec.vlan
---
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetwork
metadata:
  name: ngc809-tenant-75
  namespace: openshift-sriov-network-operator
  annotations:
    operator.sriovnetwork.openshift.io/last-network-namespace: <namespace>
spec:
  ipam: '{"type": "host-local","ranges": [[{"subnet": "<vf1-client-subnet>"}]],"dataDir": "/run/my-orchestrator/container-ipam-state-1"}'
  logLevel: info
  maxTxRate: 0   # spec.vf1.rateMbps (+ rateMode, applied by tools/render.py)
  minTxRate: 0   # spec.vf1.rateMbps (+ rateMode, applied by tools/render.py)
  networkNamespace: <namespace>
  resourceName: ngc809_nic2_vf1
  spoofChk: 'off'
  trust: 'on'
  vlan: 0        # spec.vlan
---
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetwork
metadata:
  name: ngc809-vf0-25-m0
  namespace: openshift-sriov-network-operator
  annotations:
    operator.sriovnetwork.openshift.io/last-network-namespace: <namespace>
spec:
  ipam: '{"type": "static", "addresses": [{"address": "<vf0-server-address>"}]}'
  logLevel: info
  maxTxRate: 0   # spec.vf0.rateMbps (+ rateMode, applied by tools/render.py)
  minTxRate: 0   # spec.vf0.rateMbps (+ rateMode, applied by tools/render.py)
  networkNamespace: <namespace>
  resourceName: ngc809_m0_vf0
  spoofChk: 'off'
  trust: 'off'
  vlan: 0        # spec.vlan
---
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetwork
metadata:
  name: ngc809-vf0-25-aw1
  namespace: openshift-sriov-network-operator
  annotations:
    operator.sriovnetwork.openshift.io/last-network-namespace: <namespace>
spec:
  ipam: '{"type": "static", "addresses": [{"address": "<vf0-client-address>"}]}'
  logLevel: info
  maxTxRate: 0   # spec.vf0.rateMbps (+ rateMode, applied by tools/render.py)
  minTxRate: 0   # spec.vf0.rateMbps (+ rateMode, applied by tools/render.py)
  networkNamespace: <namespace>
  resourceName: ngc809_aw1_vf0
  spoofChk: 'off'
  trust: 'off'
  vlan: 0        # spec.vlan

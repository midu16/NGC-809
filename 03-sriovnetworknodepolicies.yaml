    - ens1f0np0#0-0
    vendor: 15b3
  nodeSelector:
    kubernetes.io/hostname: master-0.cwl.integration.core.bos2.lab
  numVfs: 2
  priority: 99
  resourceName: ngc809_m0_vf0
---

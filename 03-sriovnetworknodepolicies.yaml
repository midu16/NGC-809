# NGC-809 — exported live from CWL (OCP 4.22.3) on 2026-11-11 by ngc-809/tools/clean_export.py.
# SR-IOV operator: map VF0 / VF1 of each node to kubelet resources (externallyManaged: nmstate owns the VFs).
# WARNING: applying/changing these makes sriov-network-config-daemon rebind VFs that are attached to running pods.
# Apply BEFORE the pods and wait until both SriovNetworkNodeStates are Succeeded and the resources are allocatable.
---
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetworkNodePolicy
metadata:
  name: ngc809-master0-nic2-vf
  namespace: openshift-sriov-network-operator
spec:
  deviceType: netdevice
  externallyManaged: true
  isRdma: true
  nicSelector:
    deviceID: 101f
    pfNames:
    - ens1f0np0#1-1
    vendor: 15b3
  nodeSelector:
    kubernetes.io/hostname: master-0.cwl.integration.core.bos2.lab
  numVfs: 2
  priority: 99
  resourceName: ngc809_srv_nic2_vf
---
apiVersion: sriovnetwork.openshift.io/v1
kind: SriovNetworkNodePolicy
metadata:
  name: ngc809-nic2-vf1-tenant
  namespace: openshift-sriov-network-operator

  deviceType: netdevice
  externallyManaged: true
  isRdma: true
  nicSelector:
    deviceID: 101f
    pfNames:
    - ens1f0np0#1-1
    vendor: 15b3
  nodeSelector:
    kubernetes.io/hostname: appworker-1.cwl.integration.core.bos2.lab
  numVfs: 2
  priority: 99
  resourceName: ngc809_nic2_vf1
---
apiVersion: sriovnetwork.openshift.io/v1
